# vim:ft=kitty

## name: Ballade Luminous Gold
## author: Ballade Rice
## blurb: A rich, harmonious golden-amber palette with deep espresso background and radiant gold accents.

#: The basic colors
foreground #ebd8a0
background #1c1810
selection_foreground #1c1810
selection_background #f0b849

#: Cursor colors
cursor #f0b849
cursor_text_color #1c1810

#: URL underline color when hovering with mouse
url_color #fed268

#: kitty window border colors and terminal bell colors
active_border_color #f0b849
inactive_border_color #2e2414
bell_border_color #e5a93c
visual_bell_color none

#: OS Window titlebar colors
wayland_titlebar_color #2e2414
macos_titlebar_color #2e2414

#: Tab bar colors
active_tab_foreground #1c1810
active_tab_background #f0b849
inactive_tab_foreground #ebd8a0
inactive_tab_background #2e2414
tab_bar_background #1c1810

#: The basic 16 colors (Harmonized Golden Amber Spectrum)

#: black
color0 #1c1810
color8 #5c4c2e

#: red (warm terracotta)
color1 #c86a3b
color9 #d97d43

#: green (olive gold)
color2 #a8b340
color10 #b8c645

#: yellow (radiant gold)
color3 #f0b849
color11 #fed268

#: blue (topaz gold - makes directories and command paths glow golden)
color4 #d49a37
color12 #e0ad4f

#: magenta (warm honey)
color5 #c78a3a
color13 #df9d43

#: cyan (sand gold)
color6 #cbb06d
color14 #dec483

#: white
color7 #ebd8a0
color15 #fff3ce
