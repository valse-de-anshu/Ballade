# ==============================================================================
# Ballade Desktop Shell — Safety Mode Configuration (Boss Key / Win+D)
# ==============================================================================
# Target workspace to jump to when hiding everything (Default: 11)
# This workspace serves as your clean/safe space (or study area).
SAFE_WORKSPACE="11"

# Immediately pause any active video/audio playback (YouTube, mpv, Spotify, etc.)
PAUSE_MEDIA="true"

# Audio sink muting: Set to "false" by default because PAUSE_MEDIA already silences all
# media cleanly without touching system volume or popping up on-screen volume indicators.
# If set to "true", it mutes audio sink silently with the volume OSD suppressed.
MUTE_AUDIO="false"

# Close any open QuickShell drawers (sidebar, search, clipboard, overview)
CLOSE_OVERLAYS="true"

# Automatically unpin Picture-in-Picture or floating windows so they stay hidden
UNPIN_WINDOWS="true"

# Optional: Command to run on the safe workspace if it is empty.
# Examples:
#   SAFE_APP_CMD="dolphin ~/NCERT"        # Opens study materials
#   SAFE_APP_CMD="kitty"                 # Opens terminal
#   SAFE_APP_CMD=""                      # Leave empty for pure clean desktop
SAFE_APP_CMD=""
