# ==============================================================================
# Ballade Desktop Shell — Safety Mode Configuration (Boss Key / Win+D)
# ==============================================================================
# Target workspace to jump to when hiding everything (Default: 11)
# Workspace 11 sits outside the main 1..10 bar group for complete stealth.
SAFE_WORKSPACE="11"

# Immediately pause any active video/audio playback (YouTube, mpv, Spotify, etc.)
PAUSE_MEDIA="true"

# Audio sink muting: Set to "false" by default because PAUSE_MEDIA already silences all
# media cleanly without touching system volume or popping up on-screen volume indicators.
# If set to "true", audio is muted silently with the volume OSD suppressed.
MUTE_AUDIO="false"

# Close any open QuickShell drawers (sidebar, search, clipboard)
CLOSE_OVERLAYS="true"

# Automatically unpin Picture-in-Picture or floating windows so they stay hidden
UNPIN_WINDOWS="true"

# Auto-open Settings when entering Safe Mode so you have a natural alibi/explanation!
OPEN_SETTINGS="true"

# Which settings to open:
#   "ballade"             -> Opens Ballade's instant frosted-glass Settings Hub
#   "ballade:appearance"  -> Opens Ballade Settings on the Appearance/Theming tab
#   "systemsettings"      -> Launches KDE Plasma System Settings
SETTINGS_APP="ballade"

# Optional: Command to run on the safe workspace if it is empty.
# (If OPEN_SETTINGS="true", this is ignored or runs in addition)
SAFE_APP_CMD=""
