# vim:ft=kitty

## name: Ballade Warm Sunset Orange
## author: Ballade Rice
## blurb: A cozy, warm autumn ember palette with deep roasted cocoa background and soft citrus glow.

#: The basic colors
foreground #e8dcd5
background #1c1512
selection_foreground #1c1512
selection_background #ff9248

#: Cursor colors
cursor #ff9248
cursor_text_color #1c1512

#: URL underline color when hovering with mouse
url_color #f5ad58

#: kitty window border colors and terminal bell colors
active_border_color #ff9248
inactive_border_color #2f201a
bell_border_color #e67e43
visual_bell_color none

#: OS Window titlebar colors
wayland_titlebar_color #2f201a
macos_titlebar_color #2f201a

#: Tab bar colors
active_tab_foreground #1c1512
active_tab_background #ff9248
inactive_tab_foreground #e8dcd5
inactive_tab_background #2f201a
tab_bar_background #1c1512

#: The basic 16 colors (Warm Harmonized Autumn Amber Palette)

#: black
color0 #1c1512
color8 #5e4337

#: red (warm rust ember)
color1 #cf5d44
color9 #e07055

#: green (olive matcha)
color2 #9fb865
color10 #b2cc76

#: yellow (harvest sunburst)
color3 #e8a84a
color11 #f7bb63

#: blue (warm amber - makes directory paths glow warm orange)
color4 #e58e58
color12 #f7a26d

#: magenta (warm coral rose)
color5 #db7b62
color13 #ec8f77

#: cyan (apricot sandstone)
color6 #d49a7a
color14 #e5ad8e

#: white
color7 #e8dcd5
color15 #fff3ed
