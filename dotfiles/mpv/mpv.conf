# ==============================================================================
# MPV Configuration - Unixporn Minimal UI
# ==============================================================================

# --- UI & OSC (uosc requirements) ---
# Disable default OSC and border to let uosc render them
osc=no
osd-bar=no
border=no

# --- Video & Performance ---
profile=high-quality
hwdec=auto-safe      # Enable hardware decoding
vo=gpu-next          # Modern video output driver
gpu-api=auto

# --- Window ---
keep-open=yes        # Keep the player open when a file finishes
autofit=60%x60%      # Pop-up size (60% of screen dimensions)
geometry=50%:50%     # Always open exactly in the center of the screen
force-window=immediate # Pop up the window immediately
cursor-autohide=1000 # Autohide cursor after 1 second

# --- Audio ---
volume=100           # Default volume
volume-max=200       # Max volume 200%
audio-pitch-correction=yes
audio-channels=auto

# --- Subtitles ---
demuxer-mkv-subtitle-preroll=yes
sub-auto=fuzzy       # Load all subtitle files containing the video name
sub-font="sans-serif"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
slang=en,eng         # Preferred subtitle language

# --- Playback ---
save-position-on-quit=yes # Save playback position

# --- Screenshots ---
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=7
screenshot-directory="~/Pictures/mpv"
screenshot-template="%F-[%wH:%wM:%wS]-%#00n"

# --- Yt-dlp / Streaming ---
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best # Optimize for 1080p
