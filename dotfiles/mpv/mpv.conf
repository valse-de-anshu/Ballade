# ==============================================================================
# MPV Configuration - Ultra-Fast, Responsive & Snappy
# ==============================================================================

# --- UI & OSC (uosc requirements) ---
osc=no
osd-bar=no
border=no

# --- Blazing-Fast Video & Hardware Acceleration ---
profile=fast               # Lightweight profile: low CPU/GPU footprint, zero lag
hwdec=auto-safe            # Hardware decoding (VAAPI/NVDEC/VDPAU)
vo=gpu-next                # Modern video output with libplacebo & fast shader pipeline
gpu-api=auto
gpu-context=auto
gpu-shader-cache-dir="~/.cache/mpv/shaders" # Cache compiled shaders to avoid freeze on toggle

# --- Instant Seeking & Smart RAM Caching ---
hr-seek=yes                # Precise seeking
hr-seek-framedrop=yes      # Don't lag/stutter if frames take time to decode when seeking
cache=yes                  # Enable memory caching
cache-secs=30              # Buffer 30 seconds ahead
demuxer-max-bytes=150MiB   # 150MB forward RAM cache
demuxer-max-back-bytes=50MiB # 50MB backward RAM cache for instant scrubbing
demuxer-readahead-secs=20  # Fast stream read-ahead

# --- Window & Startup ---
keep-open=yes              # Keep player open when file finishes
autofit=65%x65%            # Clean, readable window size
geometry=50%:50%           # Center of screen
force-window=immediate     # Pop up instantly
cursor-autohide=800        # Hide cursor quickly

# --- Audio ---
volume=100
volume-max=200
audio-pitch-correction=yes
audio-channels=auto

# --- Subtitles ---
demuxer-mkv-subtitle-preroll=yes
sub-auto=fuzzy
sub-font="sans-serif"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
slang=en,eng

# --- Playback ---
save-position-on-quit=yes

# --- Screenshots (Instant Saving without Lag) ---
screenshot-format=png
screenshot-high-bit-depth=no
screenshot-png-compression=1
screenshot-directory="~/Pictures/mpv"
screenshot-template="%F-[%wH:%wM:%wS]-%#00n"

# --- Yt-dlp / Streaming ---
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best
