# ==============================================================================
# uosc Configuration - Clean, Snappy, Minimal & User-Friendly
# ==============================================================================

# --- UI Scaling & Visibility ---
# 1.0 ensures clean, crisp, and properly readable text and icons on all screens
scale=1.0
scale_fullscreen=1.1
font_scale=1.0
text_border=1.2
border_radius=6

# --- Super Snappy Responsiveness ---
# Fast animation duration (80ms) for instant, lag-free UI feel
animation_duration=80
proximity_in=40
proximity_out=100

# --- Timeline (Progress Bar) ---
timeline_style=line
timeline_line_width=3
timeline_size=32
timeline_border=1
timeline_persistency=

# --- Bottom Controls Bar ---
# Minimal, symmetrical & loaded with Settings, Info, Keybindings, Controls:
# [Left: Menu, Subs, Audio, Info/Stats, Keybinds] | [Center: Prev, Play, Next, Playlist] | [Right: Speed, Fullscreen]
controls=menu,gap,subtitles,audio,gap,command:info:script-binding stats/display-stats-toggle?Stats & Info,command:help:script-binding uosc/keybinds?Key bindings,space,prev,play-pause,next,items,space,speed,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=4

# --- Top Bar ---
top_bar=no-border
top_bar_size=36
top_bar_controls=right
top_bar_title=yes

# --- Volume & Speed ---
volume=right
volume_size=36
volume_step=5
speed_step=0.1

# --- Opacity & Aesthetics ---
# Sleek dark minimal theme, no dimming curtain, no audio indicator clutter
opacity=curtain=0,audio_indicator=0,timeline=0.9,controls=0.85,menu=1.0
color=foreground=ffffff,foreground_text=000000,background=111111,background_text=ffffff,curtain=000000,success=a3be8c,error=bf616a
