# uosc - Modern, proximity-based UI for mpv (Compact & Symmetrical)

# --- UI Scaling & Size ---
# Scales down the entire UI (and the menu) to make it much smaller and more compact
scale=0.6
# Timeline (progress bar) size. Keeping it very thin.
timeline_size_min=1
timeline_size_max=10
timeline_style=line
timeline_opacity=1

# --- Layout & Ordering ---
# Symmetrical layout: Left (menu/subs/audio) | Center (prev/play/next) | Right (speed/fullscreen)
controls=menu,gap,subtitles,audio,gap,space,gap,prev,play-pause,next,items,gap,space,gap,speed,gap,fullscreen

# --- Appearance ---
ui_opacity=0.9
ui_radius=6
border_size=0
border_radius=6
animation_duration=200
font_size=13

# Remove the dark "dimming" effect (curtain) when opening the menu and hide the audio logo
opacity=curtain=0,audio_indicator=0

# --- Top Bar ---
top_bar_style=transparent
top_bar_controls=no

# --- Colors ---
color=foreground=ffffff,foreground_text=000000,background=111111,background_text=ffffff,curtain=000000,success=a3be8c,error=bf616a

# --- Timings ---
controls_timeout=1500
