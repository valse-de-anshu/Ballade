# --- Default UOSC Menu Restore ---
s script-binding uosc/subtitles #! Subtitles
a script-binding uosc/audio #! Audio tracks
_ script-binding uosc/stream-quality #! Stream quality
> script-binding uosc/items #! Playlist
_ script-binding uosc/chapters #! Chapters
N script-binding uosc/next #! Navigation > Next
P script-binding uosc/prev #! Navigation > Prev
_ script-binding uosc/delete-file-next #! Navigation > Delete file & Next
_ script-binding uosc/delete-file-prev #! Navigation > Delete file & Prev
_ script-binding uosc/delete-file-quit #! Navigation > Delete file & Quit
_ script-binding uosc/open-file #! Navigation > Open file
_ set video-aspect-override no #! Utils > Aspect ratio > Default
_ set video-aspect-override "16:9" #! Utils > Aspect ratio > 16:9
_ set video-aspect-override "4:3" #! Utils > Aspect ratio > 4:3
_ set video-aspect-override "2.35:1" #! Utils > Aspect ratio > 2.35:1
_ script-binding uosc/audio-device #! Utils > Audio devices
_ script-binding uosc/editions #! Utils > Editions
_ async screenshot #! Utils > Screenshot
? script-binding uosc/keybinds #! Utils > Key bindings
_ script-binding uosc/show-in-directory #! Utils > Show in directory
_ script-binding uosc/open-config-directory #! Utils > Open config folder
