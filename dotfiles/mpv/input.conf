# ------------------------------------------------------------------------------
# MPV input bindings for UOSC and general control
# ------------------------------------------------------------------------------

# Right-click to open uosc menu
MBTN_RIGHT    script-binding uosc/menu
MENU          script-binding uosc/menu

# Basic Controls
SPACE         cycle pause
ENTER         cycle fullscreen
ESC           set fullscreen no

# Seeking
RIGHT         seek  5
LEFT          seek -5
SHIFT+RIGHT   seek  30
SHIFT+LEFT    seek -30

# Volume
UP            add volume  5
DOWN          add volume -5
WHEEL_UP      add volume  5
WHEEL_DOWN    add volume -5

# Playlist Navigation (Works great with autoload.lua)
>             playlist-next
<             playlist-prev
N             playlist-next
P             playlist-prev

# Subtitles
s             cycle sub
S             cycle sub down
v             cycle sub-visibility

# Audio
a             cycle audio

# Help & Interactive Keybindings Viewer in UI
?             script-binding uosc/keybinds
h             script-binding uosc/keybinds

# Mouse Wheel on Timeline
# Note: uosc automatically handles scrolling on the timeline and volume bar.

# ------------------------------------------------------------------------------
# Shaders & Effects
# ------------------------------------------------------------------------------

# Anime4K (High-Quality Upscaling for Anime/Cartoons)
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_M.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A (Fast) Activated!"
CTRL+2 no-osd change-list glsl-shaders clr ""; show-text "Shaders: Cleared"

# FSRCNNX (High-Quality Upscaling for Live-Action Movies/Videos)
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX.glsl"; show-text "FSRCNNX: Enabled"

# Dream/Glow Shader (Foggy, dream-like aesthetic)
CTRL+4 no-osd change-list glsl-shaders toggle "~~/shaders/dream.glsl"; show-text "Dream Shader: Toggled"

























