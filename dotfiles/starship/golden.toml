add_newline = true

format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#f0b849) "
error_symbol = "[╰─](bold fg:#c86a3b) "

[username]
show_always = true
style_user = "bg:#3d3019 fg:#f0b849 bold"
style_root = "bg:#3d3019 fg:#c86a3b bold"
format = "[╭─](bold fg:#3d3019)[󰭹 $user]($style)[](bold fg:#3d3019) "

[hostname]
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#262016 fg:#ebd8a0 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#262016)[$path]($style)[](bold fg:#262016) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = " "
style = "bg:#3d3019 fg:#a8b340 bold"
format = "[](bold fg:#3d3019)[$symbol$branch]($style)[](bold fg:#3d3019) "

[git_status]
style = "bg:#3d3019 fg:#fed268 bold"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#262016 fg:#fed268 bold"
format = "[](bold fg:#262016)[󱑎 $time]($style)[](bold fg:#262016) "

[cmd_duration]
min_time = 2_000
style = "bg:#3d3019 fg:#cbb06d bold"
format = "[](bold fg:#3d3019)[󱐋 $duration]($style)[](bold fg:#3d3019) "
