# Don't print a new line at the start of the prompt
add_newline = true

# The r/unixporn "Pill" layout with Live Time added
format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#f0b849) "
error_symbol = "[╰─](bold fg:#d9534f) "

[username]
show_always = true
style_user = "bg:#3d2f17 fg:#f0b849 bold"
style_root = "bg:#3d2f17 fg:#d9534f bold"
# Added the closing curve [] and a space to the end of this format string
format = "[╭─](bold fg:#3d2f17)[󰭹 $user]($style)[](bold fg:#3d2f17) "

[hostname]
# Disabled the hostname so "anshu" stops printing a second time
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#2a1f0f fg:#faedd2 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#2a1f0f)[$path]($style)[](bold fg:#2a1f0f) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = "󰘬 "
style = "bg:#f0b849 fg:#1e1507 bold"
format = "[](bold fg:#f0b849)[$symbol$branch]($style)[](bold fg:#f0b849) "

[git_status]
style = "bg:#d9534f fg:#1e1507 bold"
format = "[](bold fg:#d9534f)[$all_status$ahead_behind]($style)[](bold fg:#d9534f) "
# Simplified, universally understood status icons:
conflicted = "!! "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "S "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "x "

[cmd_duration]
min_time = 500
style = "bg:#d49b2c fg:#1e1507 bold"
format = "[](bold fg:#d49b2c)[󰪢 $duration]($style)[](bold fg:#d49b2c)"

[package]
disabled = true
