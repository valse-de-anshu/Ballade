# Don't print a new line at the start of the prompt
add_newline = true

# The r/unixporn "Pill" layout with Live Time added
format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#f58bb6) "
error_symbol = "[╰─](bold fg:#ff5370) "

[username]
show_always = true
style_user = "bg:#4a2840 fg:#f58bb6 bold"
style_root = "bg:#4a2840 fg:#ff5370 bold"
# Added the closing curve [] and a space to the end of this format string
format = "[╭─](bold fg:#4a2840)[󰭹 $user]($style)[](bold fg:#4a2840) "

[hostname]
# Disabled the hostname so "anshu" stops printing a second time
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#2b2133 fg:#f5d6e6 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#2b2133)[$path]($style)[](bold fg:#2b2133) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = "󰘬 "
style = "bg:#f07178 fg:#1f1a24 bold"
format = "[](bold fg:#f07178)[$symbol$branch]($style)[](bold fg:#f07178) "

[git_status]
style = "bg:#ff5370 fg:#1f1a24 bold"
format = "[](bold fg:#ff5370)[$all_status$ahead_behind]($style)[](bold fg:#ff5370) "
# Simplified, universally understood status icons:
conflicted = "!! "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "S "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "x "

[cmd_duration]
min_time = 500
style = "bg:#ffcb6b fg:#1f1a24 bold"
format = "[](bold fg:#ffcb6b)[󰪢 $duration]($style)[](bold fg:#ffcb6b)"

[package]
disabled = true