add_newline = true

format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#f06292) "
error_symbol = "[╰─](bold fg:#ff5252) "

[username]
show_always = true
style_user = "bg:#4a2840 fg:#f06292 bold"
style_root = "bg:#4a2840 fg:#ff5252 bold"
format = "[╭─](bold fg:#4a2840)[󰭹 $user]($style)[](bold fg:#4a2840) "

[hostname]
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#261922 fg:#fce4ec bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#261922)[$path]($style)[](bold fg:#261922) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = " "
style = "bg:#4a2840 fg:#81c784 bold"
format = "[](bold fg:#4a2840)[$symbol$branch]($style)[](bold fg:#4a2840) "

[git_status]
style = "bg:#4a2840 fg:#ffd54f bold"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#261922 fg:#f48fb1 bold"
format = "[](bold fg:#261922)[󱑎 $time]($style)[](bold fg:#261922) "

[cmd_duration]
min_time = 2_000
style = "bg:#4a2840 fg:#ba68c8 bold"
format = "[](bold fg:#4a2840)[󱐋 $duration]($style)[](bold fg:#4a2840) "
