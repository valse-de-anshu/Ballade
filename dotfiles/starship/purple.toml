# Don't print a new line at the start of the prompt
add_newline = true

# The r/unixporn "Pill" layout with Live Time added
format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#ba68c8) "
error_symbol = "[╰─](bold fg:#cf4d4d) "

[username]
show_always = true
style_user = "bg:#2d1b3d fg:#ba68c8 bold"
style_root = "bg:#2d1b3d fg:#cf4d4d bold"
# Added the closing curve [] and a space to the end of this format string
format = "[╭─](bold fg:#2d1b3d)[󰭹 $user]($style)[](bold fg:#2d1b3d) "

[hostname]
# Disabled the hostname so "anshu" stops printing a second time
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#1e102b fg:#ede3f2 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#1e102b)[$path]($style)[](bold fg:#1e102b) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = "󰘬 "
style = "bg:#ba68c8 fg:#140920 bold"
format = "[](bold fg:#ba68c8)[$symbol$branch]($style)[](bold fg:#ba68c8) "

[git_status]
style = "bg:#cf4d4d fg:#140920 bold"
format = "[](bold fg:#cf4d4d)[$all_status$ahead_behind]($style)[](bold fg:#cf4d4d) "
# Simplified, universally understood status icons:
conflicted = "!! "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "S "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "x "

[cmd_duration]
min_time = 500
style = "bg:#9c5adb fg:#140920 bold"
format = "[](bold fg:#9c5adb)[󰪢 $duration]($style)[](bold fg:#9c5adb)"

[package]
disabled = true
