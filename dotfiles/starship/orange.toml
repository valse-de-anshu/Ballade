# Don't print a new line at the start of the prompt
add_newline = true

# The r/unixporn "Pill" layout with Live Time added
format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#ff9248) "
error_symbol = "[╰─](bold fg:#e04f4f) "

[username]
show_always = true
style_user = "bg:#3d2216 fg:#ff9248 bold"
style_root = "bg:#3d2216 fg:#e04f4f bold"
# Added the closing curve [] and a space to the end of this format string
format = "[╭─](bold fg:#3d2216)[󰭹 $user]($style)[](bold fg:#3d2216) "

[hostname]
# Disabled the hostname so "anshu" stops printing a second time
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#2a160d fg:#faeae3 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#2a160d)[$path]($style)[](bold fg:#2a160d) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = "󰘬 "
style = "bg:#ff9248 fg:#200f07 bold"
format = "[](bold fg:#ff9248)[$symbol$branch]($style)[](bold fg:#ff9248) "

[git_status]
style = "bg:#e04f4f fg:#200f07 bold"
format = "[](bold fg:#e04f4f)[$all_status$ahead_behind]($style)[](bold fg:#e04f4f) "
# Simplified, universally understood status icons:
conflicted = "!! "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "S "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "x "

[cmd_duration]
min_time = 500
style = "bg:#e0762f fg:#200f07 bold"
format = "[](bold fg:#e0762f)[󰪢 $duration]($style)[](bold fg:#e0762f)"

[package]
disabled = true
