add_newline = true

format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#7aa2f7) "
error_symbol = "[╰─](bold fg:#f7768e) "

[username]
show_always = true
style_user = "bg:#283457 fg:#7aa2f7 bold"
style_root = "bg:#283457 fg:#f7768e bold"
format = "[╭─](bold fg:#283457)[󰭹 $user]($style)[](bold fg:#283457) "

[hostname]
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#1f2335 fg:#c0caf5 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#1f2335)[$path]($style)[](bold fg:#1f2335) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = " "
style = "bg:#283457 fg:#9ece6a bold"
format = "[](bold fg:#283457)[$symbol$branch]($style)[](bold fg:#283457) "

[git_status]
style = "bg:#283457 fg:#ff9e64 bold"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#1f2335 fg:#7dcfff bold"
format = "[](bold fg:#1f2335)[󱑎 $time]($style)[](bold fg:#1f2335) "

[cmd_duration]
min_time = 2_000
style = "bg:#283457 fg:#bb9af7 bold"
format = "[](bold fg:#283457)[󱐋 $duration]($style)[](bold fg:#283457) "
