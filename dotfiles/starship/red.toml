# Don't print a new line at the start of the prompt
add_newline = true

# The r/unixporn "Pill" layout with Live Time added
format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#e55353) "
error_symbol = "[╰─](bold fg:#b33a3a) "

[username]
show_always = true
style_user = "bg:#3d161a fg:#e55353 bold"
style_root = "bg:#3d161a fg:#b33a3a bold"
# Added the closing curve [] and a space to the end of this format string
format = "[╭─](bold fg:#3d161a)[󰭹 $user]($style)[](bold fg:#3d161a) "

[hostname]
# Disabled the hostname so "anshu" stops printing a second time
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#290c0f fg:#fae6e8 bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#290c0f)[$path]($style)[](bold fg:#290c0f) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = "󰘬 "
style = "bg:#e55353 fg:#200608 bold"
format = "[](bold fg:#e55353)[$symbol$branch]($style)[](bold fg:#e55353) "

[git_status]
style = "bg:#b33a3a fg:#200608 bold"
format = "[](bold fg:#b33a3a)[$all_status$ahead_behind]($style)[](bold fg:#b33a3a) "
# Simplified, universally understood status icons:
conflicted = "!! "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "S "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "x "

[cmd_duration]
min_time = 500
style = "bg:#c23f3f fg:#200608 bold"
format = "[](bold fg:#c23f3f)[󰪢 $duration]($style)[](bold fg:#c23f3f)"

[package]
disabled = true
