add_newline = true

format = """
$username$directory$time$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰─](bold fg:#ff5252) "
error_symbol = "[╰─](bold fg:#ff1744) "

[username]
show_always = true
style_user = "bg:#4d2225 fg:#ff5252 bold"
style_root = "bg:#4d2225 fg:#ff1744 bold"
format = "[╭─](bold fg:#4d2225)[󰭹 $user]($style)[](bold fg:#4d2225) "

[hostname]
disabled = true

[directory]
home_symbol = " "
read_only = " "
style = "bg:#291819 fg:#ffebee bold"
truncation_length = 3
truncation_symbol = "••/"
format = "[](bold fg:#291819)[$path]($style)[](bold fg:#291819) "

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "

[git_branch]
symbol = " "
style = "bg:#4d2225 fg:#81c784 bold"
format = "[](bold fg:#4d2225)[$symbol$branch]($style)[](bold fg:#4d2225) "

[git_status]
style = "bg:#4d2225 fg:#ffb74d bold"
format = "[$all_status$ahead_behind]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#291819 fg:#ef9a9a bold"
format = "[](bold fg:#291819)[󱑎 $time]($style)[](bold fg:#291819) "

[cmd_duration]
min_time = 2_000
style = "bg:#4d2225 fg:#e57373 bold"
format = "[](bold fg:#4d2225)[󱐋 $duration]($style)[](bold fg:#4d2225) "
